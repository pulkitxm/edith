pre-push:
  parallel: true
  commands:
    comments:
      glob: "*.{swift,js,mjs,ts,tsx,css,json,yaml,yml,html}"
      run: make ci-comments
    secrets:
      run: make ci-secrets
    duplicate-keys:
      glob: "Packages/**/*.swift"
      run: make ci-duplicate-keys
    lint:
      glob: "{scripts/**,apps/site/**}"
      run: make ci-lint
    scripts:
      glob: "scripts/**"
      run: make ci-scripts
    promo-video:
      glob: "apps/promo-video/**"
      run: make ci-promo
    swift-lint:
      glob: "{Packages/**,Resources/**,edth.xcodeproj/**,docs/**,build.sh}"
      run: make ci-swift-lint
    swift-build:
      glob: "{Packages/**,Resources/**,edth.xcodeproj/**,docs/**,build.sh}"
      run: make ci-swift-build
    swift-test:
      glob: "{Packages/**,Resources/**,edth.xcodeproj/**,docs/**,build.sh}"
      run: make ci-swift-test
