[package]
name = "companion"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
base64 = "0.23.1"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
hex = "0.4"
lexopt = "0.3"
pdf-extract = "0.12.0"
redis = { version = "1", features = ["tokio-comp"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "multipart", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10.0"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "uuid", "json", "macros"] }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
