<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="/styles.css"><style>.card-spotify{animation-delay:-4.5s !important}.sp-art img,.sp-track > span{animation-delay:-7.5s !important}.sp-art img:nth-child(2),.sp-track > span:nth-child(2){animation-delay:-1.5s !important}.sp-art img:nth-child(3),.sp-track > span:nth-child(3){animation-delay:-13.5s !important}</style></head><body style="padding:24px;width:346px"><div class="card card-spotify">
            <div class="card-art">
              <span class="sp-art">
                <img src="/music/cover-1.jpg" alt="" />
                <img src="/music/cover-2.jpg" alt="" />
                <img src="/music/cover-3.jpg" alt="" />
              </span>
              <span class="sp-body">
                <span class="sp-track">
                  <span><i class="dot sage"></i>Spotify · Weightless</span>
                  <span><i class="dot accent"></i>Apple Music · Nightcall</span>
                  <span><i class="dot sage"></i>Spotify · Teardrop</span>
                </span>
                <span class="bar"><i></i></span>
                <span class="card-label mono sp-time"></span>
              </span>
            </div>
            <h4>Spotify &amp; Apple Music</h4>
            <p>
              Whatever is already playing shows up in the player with full controls, next to your
              local library.
            </p>
          </div></body></html>
