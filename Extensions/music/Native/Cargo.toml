[package]
name = "edith-music-player"
version = "0.1.0"
edition = "2024"

[lib]
name = "edith_music_player"
crate-type = ["cdylib"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
librespot = { version = "=0.8.0", default-features = false, features = ["native-tls", "rodio-backend"] }
librespot-oauth = { version = "=0.8.0", default-features = false, features = ["native-tls"] }
keyring = { version = "3.6", features = ["apple-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
oauth2 = { version = "5", default-features = false, features = ["reqwest"] }
open = "5"
protobuf = "3"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "time"] }

[profile.release]
strip = true
lto = "thin"
