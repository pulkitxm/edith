name: Cache the empty host
description: Reuse only the host and its narrow runtime dependencies
runs:
  using: composite
  steps:
    - name: Restore source commit times
      shell: bash
      run: python3 -B scripts/restore-source-mtimes.py
    - name: Identify the host toolchain
      id: toolchain
      shell: bash
      run: |
        fingerprint="$( { xcodebuild -version; swift --version; xcrun --sdk macosx --show-sdk-version; } | shasum -a 256 | cut -d ' ' -f 1)"
        echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
    - name: Restore host products
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: Packages/EdithHost/.build
        key: host-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('Packages/EdithHost/Package.*', 'Packages/EdithHost/Sources/**', 'Packages/ExtensionMarketplace/Package.*', 'Packages/ExtensionMarketplace/Sources/**', 'Packages/ExtensionSupport/Package.swift', 'Packages/ExtensionSupport/Sources/EdithExtensionSupport/**', 'Packages/ExtensionSupport/Sources/EdithExtensionUI/**', 'scripts/build-minimal-host.mjs') }}
        restore-keys: host-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-
