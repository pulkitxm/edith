name: Hosted shipping public release verification
"on":
  workflow_dispatch:
    inputs:
      expected_sha:
        required: true
        type: string
      request:
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: hosted-shipping-public-release-verification
  cancel-in-progress: false
jobs:
  public-release:
    name: Verify actual public host and Keep Awake installer update
    if: github.repository == 'pulkitxm/edith' && github.repository_id == '1289153439' && github.event_name == 'workflow_dispatch' && (github.actor_id == '65671483' || github.actor_id == '320458784') && github.ref == 'refs/heads/main' && inputs.expected_sha == github.sha && inputs.request != ''
    runs-on: macos-26
    timeout-minutes: 180
    env:
      PUBLIC_RELEASE_VERIFICATION: "1"
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_sha }}
      PUBLIC_RELEASE_REQUEST: ${{ inputs.request }}
      PUBLISH: "false"
      REBUILD: ""
      EXTENSION_SWIFT_JOBS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the exact reviewed disposable public verification route
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = macOS
          test "$GITHUB_REPOSITORY" = pulkitxm/edith
          test "$GITHUB_REPOSITORY_ID" = 1289153439
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$EXPECTED_SOURCE_SHA"
          [[ "$GITHUB_ACTOR_ID" = 65671483 || "$GITHUB_ACTOR_ID" = 320458784 ]]
          test "$(uname -m)" = arm64
          test "$PUBLISH" = false
          test -z "$REBUILD"
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Verify pure public admission and bounded archive contracts
        run: |
          set -euo pipefail
          bun test scripts/hosted-public-release.test.js scripts/hosted-public-release-workflow.test.js scripts/hosted-shipping-public-release.test.js scripts/hosted-shipping-public-release-workflow.test.js
          python3 -B scripts/test-hosted-public-release.py
          python3 -B scripts/test-hosted-managed-frozen-host.py
      - name: Verify unauthenticated public bytes and actual isolated installer states
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/hosted-public-release/verify-shipping.mjs
      - name: Retain bounded synthetic public verification results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hosted-shipping-public-release-verification
          path: local/hosted-shipping-public-release/result.json
          retention-days: 7
          if-no-files-found: warn
