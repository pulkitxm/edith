name: Release on merge

on:
  push:
    branches: [main]
    paths:
      - "Packages/Edith/**"
      - "Resources/**"
      - "edth.xcodeproj/**"
      - "packaging/**"
      - "build.sh"
      - "Makefile"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release-on-merge.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

concurrency:
  group: release-on-merge
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    if: "!startsWith(github.event.head_commit.message, 'Bump version to ')"
    runs-on: macos-26
    outputs:
      release_tag: ${{ steps.version.outputs.tag }}
    env:
      HAS_SIGNING: ${{ secrets.MACOS_CERT_P12 != '' }}
      HAS_SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Require release secrets
        if: env.HAS_SIGNING != 'true' || env.HAS_SPARKLE_KEY != 'true'
        run: |
          echo "release blocked: signing and Sparkle secrets are required" >&2
          exit 1

      - name: Work out the next patch version
        id: version
        run: |
          CURRENT="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          case "$CURRENT" in
            *.*.*) ;;
            *) echo "release blocked: version $CURRENT is not major.minor.patch" >&2; exit 1 ;;
          esac
          MAJOR="${CURRENT%%.*}"
          REST="${CURRENT#*.}"
          MINOR="${REST%%.*}"
          PATCH="${REST#*.}"
          case "$MAJOR$MINOR$PATCH" in
            *[!0-9]*) echo "release blocked: version $CURRENT is not numeric" >&2; exit 1 ;;
          esac
          NEXT="$MAJOR.$MINOR.$((PATCH + 1))"
          if git rev-parse "v$NEXT" >/dev/null 2>&1; then
            echo "release blocked: tag v$NEXT already exists" >&2
            exit 1
          fi
          BUILD=$(( $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Resources/Info.plist) + 1 ))
          {
            echo "next=$NEXT"
            echo "tag=v${NEXT}"
            echo "build=$BUILD"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $CURRENT -> $NEXT (build $BUILD)"

      - name: Bump, commit, and tag
        env:
          NEXT: ${{ steps.version.outputs.next }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          for plist in Resources/Info.plist Resources/HelperInfo.plist; do
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $NEXT" "$plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "$plist"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Resources/Info.plist Resources/HelperInfo.plist
          git commit -m "Bump version to ${NEXT}"
          git tag "v${NEXT}"
          git push origin HEAD:main
          git push origin "v${NEXT}"

  release:
    needs: version
    uses: ./.github/workflows/release.yml
    with:
      release_tag: ${{ needs.version.outputs.release_tag }}
    secrets: inherit
