name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: "Run every product check, then cut a release from main."
        type: boolean
        required: false
        default: false

concurrency:
  group: >-
    ci-${{ github.ref }}-${{
      github.event_name == 'workflow_dispatch' && github.run_id
      || (github.event_name == 'push'
      && (startsWith(github.event.head_commit.message, 'Release v')
      || startsWith(github.event.head_commit.message, 'Refresh the contributor list'))
      && github.sha)
      || 'active'
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    if: >-
      github.event_name != 'push'
      || (!startsWith(github.event.head_commit.message, 'Release v')
      && !startsWith(github.event.head_commit.message, 'Refresh the contributor list'))
    runs-on: macos-26
    outputs:
      swift: ${{ steps.areas.outputs.swift }}
      docs: ${{ steps.areas.outputs.docs }}
      workflows: ${{ steps.areas.outputs.workflows }}
      promo: ${{ steps.areas.outputs.promo }}
      site: ${{ steps.areas.outputs.site }}
      scripts: ${{ steps.areas.outputs.scripts }}
      source: ${{ steps.areas.outputs.source }}
      companion: ${{ steps.areas.outputs.companion }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: areas
        name: Work out which areas changed
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then
            base="$(git merge-base "origin/$BASE_REF" HEAD)"
          elif [ -n "$BEFORE" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null \
            && git merge-base --is-ancestor "$BEFORE" HEAD 2>/dev/null; then
            base="$BEFORE"
          else
            base=""
          fi
          if [ -n "$base" ]; then
            changed="$(git diff --name-only "$base" HEAD)"
            printf 'changed since %s:\n%s\n\n' "$base" "$changed"
          else
            changed=""
            echo "no comparable base commit, running every area"
          fi
          area() {
            if [ -z "$base" ] || printf '%s\n' "$changed" | grep -qE "$2"; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
              echo "$1: run"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
              echo "$1: skip"
            fi
          }
          area swift '^(Packages/Edith/|Resources/|edth\.xcodeproj/|build\.sh$|Makefile$)'
          area docs '^docs/'
          area workflows '^\.github/workflows/'
          area promo '^apps/promo-video/'
          area site '^apps/site/'
          area scripts '^(scripts/|Casks/|package\.json$|bun\.lock$|biome\.json$)'
          area source '\.(swift|js|mjs|ts|tsx|css|json|ya?ml|html)$'
          area companion '^apps/companion/'

  checks:
    needs: changes
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-go@v7
        if: needs.changes.outputs.workflows == 'true'
        with:
          go-version: "1.26.x"
          cache: false
      - run: bun install --frozen-lockfile
      - name: Validate workflows
        if: needs.changes.outputs.workflows == 'true'
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: No committed secrets
        run: make ci-secrets
      - name: No disallowed comments
        if: needs.changes.outputs.source == 'true'
        run: make ci-comments
      - name: No duplicate UserDefaults keys
        if: needs.changes.outputs.swift == 'true'
        run: make ci-duplicate-keys
      - name: Lint (Biome)
        if: needs.changes.outputs.scripts == 'true' || needs.changes.outputs.site == 'true'
        run: make ci-lint
      - name: Script tests
        if: needs.changes.outputs.scripts == 'true' || needs.changes.outputs.workflows == 'true'
        run: make ci-scripts
      - name: Site is self-contained
        if: needs.changes.outputs.site == 'true' || needs.changes.outputs.workflows == 'true'
        run: make ci-site

  promo-video:
    needs: changes
    if: needs.changes.outputs.promo == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/promo-video/package-lock.json
      - name: Install
        run: npm ci
        working-directory: apps/promo-video
      - name: Type-check
        run: npx tsc --noEmit
        working-directory: apps/promo-video

  swift-build:
    needs: changes
    if: needs.changes.outputs.swift == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Format and lint (swift-format)
        run: swift format lint --strict --parallel --recursive Sources Tests Package.swift
        working-directory: Packages/Edith
      - name: Cache resolved packages
        uses: actions/cache@v6
        with:
          path: build/SourcePackages
          key: spm-xcode-${{ runner.os }}-${{ hashFiles('edth.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Packages/Edith/Package.resolved') }}
          restore-keys: spm-xcode-${{ runner.os }}-
      - name: Build the .app bundle
        run: ./build.sh --no-open
      - name: Verify nested bundles and signing
        run: make verify-bundle

  swift-test:
    needs: changes
    if: >-
      needs.changes.outputs.swift == 'true'
      || needs.changes.outputs.docs == 'true'
      || needs.changes.outputs.workflows == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Cache resolved packages
        uses: actions/cache@v6
        with:
          path: |
            Packages/Edith/.build/checkouts
            Packages/Edith/.build/artifacts
            Packages/Edith/.build/repositories
          key: spm-swiftpm-${{ runner.os }}-${{ hashFiles('Packages/Edith/Package.resolved') }}
          restore-keys: spm-swiftpm-${{ runner.os }}-
      - name: Tests
        run: ./test.sh
        working-directory: Packages/Edith

  companion:
    needs: changes
    if: >-
      needs.changes.outputs.companion == 'true'
      || needs.changes.outputs.workflows == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Start the database
        run: |
          brew install postgresql@18 pgvector
          brew services start postgresql@18
          until pg_isready; do sleep 1; done
          createuser --superuser companion
          psql postgres -c "ALTER ROLE companion WITH PASSWORD 'companion-dev'"
          createdb --owner=companion companion
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/companion/target
          key: cargo-${{ runner.os }}-${{ hashFiles('apps/companion/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: apps/companion
      - name: Tests
        run: cargo test --locked
        working-directory: apps/companion
      - name: Migrations apply to a real pgvector database
        env:
          DATABASE_URL: postgres://companion:companion-dev@127.0.0.1:5432/companion
        run: cargo run --locked -- --migrate-only
        working-directory: apps/companion

  release:
    needs: [changes, checks, swift-build, swift-test, companion]
    if: >-
      always()
      && github.ref == 'refs/heads/main'
      && needs.changes.result == 'success'
      && needs.checks.result == 'success'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
      && ((needs.changes.outputs.swift != 'true'
      && needs.changes.outputs.workflows != 'true') || needs.swift-build.result == 'success')
      && ((needs.changes.outputs.swift != 'true'
      && needs.changes.outputs.docs != 'true'
      && needs.changes.outputs.workflows != 'true') || needs.swift-test.result == 'success')
      && ((needs.changes.outputs.companion != 'true'
      && needs.changes.outputs.workflows != 'true') || needs.companion.result == 'success')
      && ((github.event_name == 'push'
      && needs.changes.outputs.swift == 'true')
      || (github.event_name == 'workflow_dispatch' && inputs.release))
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      cut_release: true
    secrets: inherit
