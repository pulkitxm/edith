name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    if: >-
      github.event_name != 'push'
      || (!startsWith(github.event.head_commit.message, 'Release v')
      && !startsWith(github.event.head_commit.message, 'Refresh the contributor list'))
    runs-on: ubuntu-latest
    outputs:
      swift: ${{ steps.areas.outputs.swift }}
      docs: ${{ steps.areas.outputs.docs }}
      linux: ${{ steps.areas.outputs.linux }}
      workflows: ${{ steps.areas.outputs.workflows }}
      promo: ${{ steps.areas.outputs.promo }}
      site: ${{ steps.areas.outputs.site }}
      scripts: ${{ steps.areas.outputs.scripts }}
      source: ${{ steps.areas.outputs.source }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: areas
        name: Work out which areas changed
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then
            base="$(git merge-base "origin/$BASE_REF" HEAD)"
          elif [ -n "$BEFORE" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null \
            && git merge-base --is-ancestor "$BEFORE" HEAD 2>/dev/null; then
            base="$BEFORE"
          else
            base=""
          fi
          if [ -n "$base" ]; then
            changed="$(git diff --name-only "$base" HEAD)"
            printf 'changed since %s:\n%s\n\n' "$base" "$changed"
          else
            changed=""
            echo "no comparable base commit, running every area"
          fi
          area() {
            if [ -z "$base" ] || printf '%s\n' "$changed" | grep -qE "$2"; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
              echo "$1: run"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
              echo "$1: skip"
            fi
          }
          area swift '^(Packages/Edith/|Resources/|edth\.xcodeproj/|build\.sh$|Makefile$)'
          area docs '^docs/'
          area linux '^(Packages/Edith/|Resources/|packaging/|Makefile$)'
          area workflows '^\.github/workflows/'
          area promo '^apps/promo-video/'
          area site '^apps/site/'
          area scripts '^(scripts/|Casks/|package\.json$|bun\.lock$|biome\.json$)'
          area source '\.(swift|js|mjs|ts|tsx|css|json|ya?ml|html)$'

  checks:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: No committed secrets
        run: make ci-secrets
      - name: No disallowed comments
        if: needs.changes.outputs.source == 'true'
        run: make ci-comments
      - name: Lint (Biome)
        if: needs.changes.outputs.scripts == 'true' || needs.changes.outputs.site == 'true'
        run: make ci-lint
      - name: Script tests
        if: needs.changes.outputs.scripts == 'true' || needs.changes.outputs.workflows == 'true'
        run: make ci-scripts
      - name: Site is self-contained
        if: needs.changes.outputs.site == 'true'
        run: make ci-site

  ubuntu:
    needs: changes
    if: needs.changes.outputs.linux == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-24.04
    container: swift:6.3.3-noble
    steps:
      - uses: actions/checkout@v7
      - name: Install native dependencies
        run: apt-get update && apt-get install -y libgtk-4-dev desktop-file-utils appstream dpkg-dev make
      - name: Test portable core
        run: make linux-test
      - name: Validate desktop metadata
        run: make linux-metadata
      - name: Build Debian package
        run: make linux-package
      - name: Verify Debian package
        run: |
          dpkg-deb --info dist/linux/*.deb
          dpkg-deb --contents dist/linux/*.deb
          apt-get install -y ./dist/linux/*.deb
          edith-linux --diagnose
      - uses: actions/upload-artifact@v7
        with:
          name: edith-ubuntu-amd64
          path: dist/linux/*.deb
          if-no-files-found: error

  promo-video:
    needs: changes
    if: needs.changes.outputs.promo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/promo-video/package-lock.json
      - name: Install
        run: npm ci
        working-directory: apps/promo-video
      - name: Type-check
        run: npx tsc --noEmit
        working-directory: apps/promo-video

  swift-build:
    needs: changes
    if: needs.changes.outputs.swift == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Format and lint (swift-format)
        run: swift format lint --strict --parallel --recursive Sources Tests Package.swift
        working-directory: Packages/Edith
      - name: Cache resolved packages
        uses: actions/cache@v6
        with:
          path: build/SourcePackages
          key: spm-xcode-${{ runner.os }}-${{ hashFiles('edth.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Packages/Edith/Package.resolved') }}
          restore-keys: spm-xcode-${{ runner.os }}-
      - name: Build the .app bundle
        run: ./build.sh --no-open
      - name: Verify nested bundles and signing
        run: make verify-bundle

  swift-test:
    needs: changes
    if: needs.changes.outputs.swift == 'true' || needs.changes.outputs.docs == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Cache resolved packages
        uses: actions/cache@v6
        with:
          path: |
            Packages/Edith/.build/checkouts
            Packages/Edith/.build/artifacts
            Packages/Edith/.build/repositories
          key: spm-swiftpm-${{ runner.os }}-${{ hashFiles('Packages/Edith/Package.resolved') }}
          restore-keys: spm-swiftpm-${{ runner.os }}-
      - name: Tests
        run: ./test.sh
        working-directory: Packages/Edith

  release:
    needs: [changes, checks, ubuntu, promo-video, swift-build, swift-test]
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.changes.result == 'success'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
      && (needs.changes.outputs.swift == 'true' || needs.changes.outputs.linux == 'true')
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    secrets: inherit
