name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Comment-stripper self-test
        run: bun scripts/strip-comments.mjs --selftest
      - name: No disallowed comments
        run: bun scripts/strip-comments.mjs --check

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: No committed secrets
        run: bun run check-secrets

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Lint (Biome)
        run: bun run lint

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Tests
        run: bun test scripts

  promo-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install
        run: npm ci
        working-directory: apps/promo-video
      - name: Type-check
        run: npx tsc --noEmit
        working-directory: apps/promo-video

  swift:
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/macos
    steps:
      - uses: actions/checkout@v5
      - name: Format and lint (swift-format)
        run: swift format lint --strict --parallel --recursive Sources Tests Package.swift
      - name: Type-check
        run: swift build
      - name: Tests
        run: swift test
      - name: Build .app bundle (smoke test)
        run: ./build.sh --no-open
      - name: Verify nested helper bundle and signing
        run: |
          test -f dist/Edith.app/Contents/MacOS/Edith
          test -f dist/Edith.app/Contents/Resources/Edith_EdithKit.bundle/claude.svg
          test -f dist/Edith.app/Contents/Resources/Edith_EdithKit.bundle/codex.svg
          test -f dist/Edith.app/Contents/Library/LoginItems/Edith.app/Contents/MacOS/Edith
          test -f dist/Edith.app/Contents/Library/LoginItems/Edith.app/Contents/Resources/AppIcon.icns
          test -f dist/Edith.app/Contents/Library/LoginItems/Edith.app/Contents/Resources/Edith_EdithKit.bundle/claude.svg
          test -f dist/Edith.app/Contents/Library/LoginItems/Edith.app/Contents/Resources/Edith_EdithKit.bundle/codex.svg
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' dist/Edith.app/Contents/Library/LoginItems/Edith.app/Contents/Info.plist | grep -qx Edith
          test -z "$(find dist/Edith.app -print | grep Helper)"
          for plist in dist/Edith.app/Contents/Info.plist dist/Edith.app/Contents/Library/LoginItems/Edith.app/Contents/Info.plist; do
            for field in CFBundleName CFBundleDisplayName; do
              ! /usr/libexec/PlistBuddy -c "Print :$field" "$plist" | grep -q Helper
            done
          done
          codesign --verify dist/Edith.app/Contents/Library/LoginItems/Edith.app
          codesign --verify dist/Edith.app
