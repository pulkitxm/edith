name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: "Run every product check, then cut a release from main."
        type: boolean
        required: false
        default: false

concurrency:
  group: >-
    ci-${{ github.ref }}-${{
      github.event_name == 'workflow_dispatch' && github.run_id
      || (github.event_name == 'push'
      && (startsWith(github.event.head_commit.message, 'Release v')
      || startsWith(github.event.head_commit.message, 'Refresh the contributor list'))
      && github.sha)
      || 'active'
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: changes
    if: >-
      github.event_name != 'push'
      || (!startsWith(github.event.head_commit.message, 'Release v')
      && !startsWith(github.event.head_commit.message, 'Refresh the contributor list'))
    runs-on: ubuntu-latest
    outputs:
      swift: ${{ steps.areas.outputs.swift }}
      docs: ${{ steps.areas.outputs.docs }}
      workflows: ${{ steps.areas.outputs.workflows }}
      promo: ${{ steps.areas.outputs.promo }}
      site: ${{ steps.areas.outputs.site }}
      scripts: ${{ steps.areas.outputs.scripts }}
      source: ${{ steps.areas.outputs.source }}
      companion: ${{ steps.areas.outputs.companion }}
      companion_runtime: ${{ steps.areas.outputs.companion_runtime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: areas
        name: Work out which areas changed
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then
            base="$(git merge-base "origin/$BASE_REF" HEAD)"
          elif [ -n "$BEFORE" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null \
            && git merge-base --is-ancestor "$BEFORE" HEAD 2>/dev/null; then
            base="$BEFORE"
          else
            base=""
          fi
          if [ -n "$base" ]; then
            changed="$(git diff --name-only "$base" HEAD)"
            printf 'changed since %s:\n%s\n\n' "$base" "$changed"
          else
            changed=""
            echo "no comparable base commit, running every area"
          fi
          area() {
            if [ -z "$base" ] || printf '%s\n' "$changed" | grep -qE "$2"; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
              echo "$1: run"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
              echo "$1: skip"
            fi
          }
          area swift '^(Packages/Edith/|Resources/|edth\.xcodeproj/|build\.sh$|Makefile$|\.swift-format$)'
          area docs '^docs/'
          area workflows '^\.github/workflows/'
          area promo '^apps/promo-video/'
          area site '^apps/site/'
          area scripts '^(scripts/|Casks/|README\.md$|Makefile$|lefthook\.yml$|package\.json$|bun\.lock$|biome\.json$)'
          area source '\.(swift|js|mjs|ts|tsx|css|json|ya?ml|html)$'
          area companion '^apps/companion/'
          area companion_runtime '^apps/companion/(Dockerfile|compose(\.[^/]+)?\.yaml)$'

  checks:
    name: checks
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        if: needs.changes.outputs.workflows == 'true'
        with:
          go-version: "1.26.x"
          cache: false
      - run: bun install --frozen-lockfile
      - name: Validate workflows
        if: needs.changes.outputs.workflows == 'true'
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: No committed secrets
        run: make ci-secrets
      - name: No disallowed comments
        if: needs.changes.outputs.source == 'true'
        run: make ci-comments
      - name: No duplicate UserDefaults keys
        if: needs.changes.outputs.swift == 'true'
        run: make ci-duplicate-keys
      - name: Lint (Biome)
        if: needs.changes.outputs.scripts == 'true' || needs.changes.outputs.site == 'true'
        run: make ci-lint
      - name: Script tests
        if: needs.changes.outputs.scripts == 'true' || needs.changes.outputs.workflows == 'true'
        run: make ci-scripts
      - name: Site is self-contained
        if: needs.changes.outputs.site == 'true' || needs.changes.outputs.workflows == 'true'
        run: make ci-site

  promo-video:
    name: promo-video
    needs: changes
    if: needs.changes.outputs.promo == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/promo-video/package-lock.json
      - name: Install
        run: npm ci
        working-directory: apps/promo-video
      - name: Type-check
        run: npx tsc --noEmit
        working-directory: apps/promo-video

  swift-build:
    name: swift-build
    needs: changes
    if: needs.changes.outputs.swift == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Format and lint (swift-format)
        run: swift format lint --strict --parallel --recursive Sources Tests Package.swift
        working-directory: Packages/Edith
      - name: Cache resolved packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: build/SourcePackages
          key: spm-xcode-${{ runner.os }}-${{ hashFiles('edth.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Packages/Edith/Package.resolved') }}
          restore-keys: spm-xcode-${{ runner.os }}-
      - name: Build the .app bundle
        run: ./build.sh --no-open
      - name: Verify nested bundles and signing
        run: make verify-bundle

  swift-test:
    name: swift-test
    needs: changes
    if: >-
      needs.changes.outputs.swift == 'true'
      || needs.changes.outputs.docs == 'true'
      || needs.changes.outputs.workflows == 'true'
      || needs.changes.outputs.companion_runtime == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Cache resolved packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            Packages/Edith/.build/checkouts
            Packages/Edith/.build/artifacts
            Packages/Edith/.build/repositories
          key: spm-swiftpm-${{ runner.os }}-${{ hashFiles('Packages/Edith/Package.resolved') }}
          restore-keys: spm-swiftpm-${{ runner.os }}-
      - name: Tests
        run: ./test.sh
        working-directory: Packages/Edith

  companion:
    name: companion
    needs: changes
    if: >-
      needs.changes.outputs.companion == 'true'
      || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
        env:
          POSTGRES_DB: companion
          POSTGRES_USER: companion
          POSTGRES_PASSWORD: companion-dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U companion -d companion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/companion/target
          key: cargo-${{ runner.os }}-${{ hashFiles('apps/companion/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: apps/companion
      - name: Tests
        run: cargo test --locked
        working-directory: apps/companion
      - name: Migrations apply to a real pgvector database
        env:
          DATABASE_URL: postgres://companion:companion-dev@127.0.0.1:5432/companion
        run: cargo run --locked -- --migrate-only
        working-directory: apps/companion

  release:
    name: release
    needs: [changes, checks, swift-build, swift-test, companion]
    if: >-
      always()
      && github.ref == 'refs/heads/main'
      && needs.changes.result == 'success'
      && needs.checks.result == 'success'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
      && ((needs.changes.outputs.swift != 'true'
      && needs.changes.outputs.workflows != 'true') || needs.swift-build.result == 'success')
      && ((needs.changes.outputs.swift != 'true'
      && needs.changes.outputs.docs != 'true'
      && needs.changes.outputs.workflows != 'true'
      && needs.changes.outputs.companion_runtime != 'true') || needs.swift-test.result == 'success')
      && ((needs.changes.outputs.companion != 'true'
      && needs.changes.outputs.workflows != 'true') || needs.companion.result == 'success')
      && ((github.event_name == 'push'
      && needs.changes.outputs.swift == 'true')
      || (github.event_name == 'workflow_dispatch' && inputs.release))
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      cut_release: true
    secrets:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      RELEASE_PUSH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN }}
      TAP_PUSH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
      NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
