name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: "Run every product check, then cut a release from main."
        type: boolean
        required: false
        default: false
      rebuild:
        description: "Current release tag to rebuild and re-upload."
        type: string
        required: false
        default: ""

concurrency:
  group: >-
    ci-${{ github.ref }}-${{
      github.event_name == 'workflow_dispatch' && inputs.rebuild != '' && 'rebuild'
      || github.event_name == 'workflow_dispatch' && github.run_id
      || (github.event_name == 'push'
      && (startsWith(github.event.head_commit.message, 'Release v')
      || startsWith(github.event.head_commit.message, 'Refresh the contributor list'))
      && github.sha)
      || 'active'
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: changes
    if: >-
      github.event_name != 'push'
      || (!startsWith(github.event.head_commit.message, 'Release v')
      && !startsWith(github.event.head_commit.message, 'Refresh the contributor list'))
    runs-on: ubuntu-latest
    outputs:
      swift: ${{ steps.areas.outputs.swift }}
      docs: ${{ steps.areas.outputs.docs }}
      workflows: ${{ steps.areas.outputs.workflows }}
      promo: ${{ steps.areas.outputs.promo }}
      site: ${{ steps.areas.outputs.site }}
      scripts: ${{ steps.areas.outputs.scripts }}
      performance: ${{ steps.areas.outputs.performance }}
      source: ${{ steps.areas.outputs.source }}
      companion: ${{ steps.areas.outputs.companion }}
      companion_runtime: ${{ steps.areas.outputs.companion_runtime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: areas
        name: Work out which areas changed
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then
            base="$(git merge-base "origin/$BASE_REF" HEAD)"
          elif [ -n "$BEFORE" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null \
            && git merge-base --is-ancestor "$BEFORE" HEAD 2>/dev/null; then
            base="$BEFORE"
          else
            base=""
          fi
          if [ -n "$base" ]; then
            changed="$(git diff --name-only "$base" HEAD)"
            printf 'changed since %s:\n%s\n\n' "$base" "$changed"
          else
            changed=""
            echo "no comparable base commit, running every area"
          fi
          area() {
            if [ -z "$base" ] || printf '%s\n' "$changed" | grep -qE "$2"; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
              echo "$1: run"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
              echo "$1: skip"
            fi
          }
          area swift '^(scripts/test-swift-test-isolation\.py$|Packages/Edith/|Resources/|edth\.xcodeproj/|build\.sh$|Makefile$|\.swift-format$)'
          area docs '^docs/'
          area workflows '^\.github/(workflows|actions)/'
          area promo '^apps/promo-video/'
          area site '^apps/site/'
          area scripts '^(scripts/|Casks/|README\.md$|Makefile$|package\.json$|bun\.lock$|biome\.json$)'
          area performance '^(Packages/Edith/(Sources|Tests)/.*\.swift$|performance/|scripts/(check-performance-audit|bench-helper)(\.|$)|Makefile$)'
          area source '\.(swift|js|mjs|ts|tsx|css|json|ya?ml|html)$'
          area companion '^apps/companion/'
          area companion_runtime '^apps/companion/(Dockerfile|compose(\.[^/]+)?\.yaml)$'

  checks:
    name: checks
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        if: needs.changes.outputs.workflows == 'true'
        with:
          go-version: "1.26.x"
          cache: false
      - run: bun install --frozen-lockfile
      - name: Validate workflows
        if: needs.changes.outputs.workflows == 'true'
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: No committed secrets
        run: make ci-secrets
      - name: No disallowed comments
        if: needs.changes.outputs.source == 'true'
        run: make ci-comments
      - name: No duplicate UserDefaults keys
        if: needs.changes.outputs.swift == 'true'
        run: make ci-duplicate-keys
      - name: Lint (Biome)
        if: needs.changes.outputs.scripts == 'true' || needs.changes.outputs.site == 'true'
        run: make ci-lint
      - name: Script tests
        if: needs.changes.outputs.scripts == 'true' || needs.changes.outputs.workflows == 'true'
        run: make ci-scripts
      - name: Performance regression contracts
        if: needs.changes.outputs.performance == 'true' || needs.changes.outputs.workflows == 'true'
        env:
          PERFORMANCE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: make ci-performance
      - name: CLI documentation tests
        if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.workflows == 'true'
        run: make ci-docs
      - name: Embedded Companion runtime tests
        if: needs.changes.outputs.companion_runtime == 'true' || needs.changes.outputs.workflows == 'true'
        run: make ci-companion-runtime
      - name: Site is self-contained
        if: needs.changes.outputs.site == 'true' || needs.changes.outputs.workflows == 'true'
        run: make ci-site

  promo-video:
    name: promo-video
    needs: changes
    if: needs.changes.outputs.promo == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/promo-video/package-lock.json
      - name: Install
        run: npm ci
        working-directory: apps/promo-video
      - name: Type-check
        run: npx tsc --noEmit
        working-directory: apps/promo-video

  swift-build:
    name: swift-build
    needs: changes
    if: >-
      github.event_name != 'push'
      && (needs.changes.outputs.swift == 'true'
      || needs.changes.outputs.workflows == 'true')
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Format and lint (swift-format)
        run: swift format lint --strict --parallel --recursive Sources Tests Package.swift
        working-directory: Packages/Edith
      - name: Cache libghostty
        id: ghostty-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            Packages/Edith/vendor/GhosttyKit.xcframework
            Packages/Edith/vendor/GhosttyResources
          key: ghostty-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-ghostty.sh') }}
      - name: Build libghostty
        run: |
          if [ ! -d Packages/Edith/vendor/GhosttyKit.xcframework ] \
            || [ ! -d Packages/Edith/vendor/GhosttyResources/ghostty/shell-integration ] \
            || [ ! -f Packages/Edith/vendor/GhosttyResources/terminfo/78/xterm-ghostty ]; then
            command -v zig >/dev/null 2>&1 || brew install zig
            make ghostty
          fi
      - name: Save validated libghostty
        if: steps.ghostty-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            Packages/Edith/vendor/GhosttyKit.xcframework
            Packages/Edith/vendor/GhosttyResources
          key: ghostty-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-ghostty.sh') }}

      - name: Cache Swift build products
        uses: ./.github/actions/cache-swift
        with:
          variant: app-debug
      - name: Build the .app bundle
        run: ./build.sh --no-open
      - name: Verify nested bundles and signing
        run: make verify-bundle

  swift-test:
    name: swift-test
    needs: changes
    if: >-
      needs.changes.outputs.swift == 'true'
      || needs.changes.outputs.workflows == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Fish
        run: |
          command -v fish >/dev/null 2>&1 || brew install fish
          fish --version
      - name: Cache libghostty
        id: ghostty-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            Packages/Edith/vendor/GhosttyKit.xcframework
            Packages/Edith/vendor/GhosttyResources
          key: ghostty-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-ghostty.sh') }}
      - name: Build libghostty
        run: |
          if [ ! -d Packages/Edith/vendor/GhosttyKit.xcframework ] \
            || [ ! -d Packages/Edith/vendor/GhosttyResources/ghostty/shell-integration ] \
            || [ ! -f Packages/Edith/vendor/GhosttyResources/terminfo/78/xterm-ghostty ]; then
            command -v zig >/dev/null 2>&1 || brew install zig
            make ghostty
          fi
      - name: Save validated libghostty
        if: steps.ghostty-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            Packages/Edith/vendor/GhosttyKit.xcframework
            Packages/Edith/vendor/GhosttyResources
          key: ghostty-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-ghostty.sh') }}

      - name: Cache Swift build products
        uses: ./.github/actions/cache-swift
        with:
          variant: tests-debug
      - name: Verify test isolation
        run: python3 -B scripts/test-swift-test-isolation.py
      - name: Tests
        run: ./test.sh
        working-directory: Packages/Edith
        env:
          EDITH_REQUIRE_FISH_COMPLETION_TEST: "1"

  companion:
    name: companion
    needs: changes
    if: >-
      needs.changes.outputs.companion == 'true'
      || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
        env:
          POSTGRES_DB: companion
          POSTGRES_USER: companion
          POSTGRES_PASSWORD: companion-dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U companion -d companion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/companion/target
          key: cargo-${{ runner.os }}-${{ hashFiles('apps/companion/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: apps/companion
      - name: Tests
        run: cargo test --locked
        working-directory: apps/companion
      - name: Migrations apply to a real pgvector database
        env:
          DATABASE_URL: postgres://companion:companion-dev@127.0.0.1:5432/companion
        run: cargo run --locked -- --migrate-only
        working-directory: apps/companion

  version:
    name: Resolve version
    needs: changes
    if: >-
      github.ref == 'refs/heads/main'
      && needs.changes.result == 'success'
      && ((github.event_name == 'push'
      && needs.changes.outputs.swift == 'true')
      || (github.event_name == 'workflow_dispatch' && (inputs.release || inputs.rebuild != '')))
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      build: ${{ steps.resolve.outputs.build }}
      sha: ${{ steps.resolve.outputs.sha }}
    env:
      REBUILD: ${{ inputs.rebuild }}
      CUT_RELEASE: ${{ inputs.release || github.event_name == 'push' }}
      SOURCE_SHA: ${{ github.sha }}
      WORKFLOW_REF: ${{ github.ref }}
      HAS_SIGNING: ${{ secrets.MACOS_CERT_P12 != '' }}
      HAS_SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY != '' }}
      HAS_PUSH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN != '' }}
      HAS_TAP_TOKEN: ${{ secrets.TAP_PUSH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.rebuild && format('refs/tags/{0}', inputs.rebuild) || github.sha }}
          path: release-source
          fetch-depth: 0
          persist-credentials: false

      - name: Require release secrets
        run: |
          test "$WORKFLOW_REF" = refs/heads/main \
            || { echo "release blocked: run the workflow from main" >&2; exit 1; }
          if [ -z "$REBUILD" ]; then
            test "$CUT_RELEASE" = true \
              || { echo "release blocked: new releases must pass through CI" >&2; exit 1; }
            test -n "$SOURCE_SHA" \
              || { echo "release blocked: CI must provide the approved commit" >&2; exit 1; }
            test "$(git rev-parse HEAD)" = "$SOURCE_SHA" \
              || { echo "release blocked: checkout does not match the approved commit" >&2; exit 1; }
          fi
          test "$HAS_SIGNING" = true \
            || { echo "release blocked: MACOS_CERT_P12 is required" >&2; exit 1; }
          test "$HAS_SPARKLE_KEY" = true \
            || { echo "release blocked: SPARKLE_PRIVATE_KEY is required" >&2; exit 1; }
          test "$HAS_PUSH_TOKEN" = true \
            || { echo "release blocked: RELEASE_PUSH_TOKEN is required" >&2; exit 1; }
          test "$HAS_TAP_TOKEN" = true \
            || { echo "release blocked: TAP_PUSH_TOKEN is required" >&2; exit 1; }

      - name: Resolve the version to release
        id: resolve
        working-directory: release-source
        run: ../scripts/resolve-release-version.sh

  dmg:
    name: Build DMG
    needs: version
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      superseded: ${{ steps.release_build.outputs.superseded }}
    env:
      HAS_NOTARY: ${{ secrets.NOTARY_KEY_ID != '' && secrets.NOTARY_ISSUER_ID != '' && secrets.NOTARY_KEY != '' }}
      REBUILD: ${{ inputs.rebuild }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      RELEASE_BUILD: ${{ needs.version.outputs.build }}
      BUILT_SHA: ${{ needs.version.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false

      - name: Cache libghostty
        id: ghostty-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            Packages/Edith/vendor/GhosttyKit.xcframework
            Packages/Edith/vendor/GhosttyResources
          key: ghostty-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-ghostty.sh') }}

      - name: Build libghostty
        run: |
          if grep -q 'name: "GhosttyKit"' Packages/Edith/Package.swift; then
            if [ ! -d Packages/Edith/vendor/GhosttyKit.xcframework ] \
              || [ ! -d Packages/Edith/vendor/GhosttyResources/ghostty/shell-integration ] \
              || [ ! -f Packages/Edith/vendor/GhosttyResources/terminfo/78/xterm-ghostty ]; then
              command -v zig >/dev/null 2>&1 || brew install zig
              make ghostty
            fi
          fi

      - name: Save validated libghostty
        if: steps.ghostty-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            Packages/Edith/vendor/GhosttyKit.xcframework
            Packages/Edith/vendor/GhosttyResources
          key: ghostty-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-ghostty.sh') }}

      - name: Cache Swift build products
        uses: ./.github/actions/cache-swift
        with:
          variant: app-release

      - name: Stamp the release version
        run: |
          for plist in Resources/Info.plist Resources/HelperInfo.plist; do
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $RELEASE_VERSION" "$plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $RELEASE_BUILD" "$plist"
          done

      - name: Import signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/edith-signing.keychain-db"
          security create-keychain -p "$MACOS_CERT_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$MACOS_CERT_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MACOS_CERT_PASSWORD" "$KEYCHAIN"
          KEYCHAINS=("$KEYCHAIN")
          while IFS= read -r keychain; do
            KEYCHAINS+=("${keychain//\"/}")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${KEYCHAINS[@]}"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build the app
        id: release_build
        env:
          EDITH_RELEASE_ALLOW_DEV_SIGNING: "1"
        run: |
          BUILD_STATUS=0
          SUPERSEDED_FILE="$RUNNER_TEMP/release-build-superseded"
          rm -f "$SUPERSEDED_FILE"
          RELEASE_SUPERSEDED_FILE="$SUPERSEDED_FILE" \
            ./scripts/run-current-release-build.sh ./build.sh --no-open --release \
            || BUILD_STATUS=$?
          if [ -f "$SUPERSEDED_FILE" ]; then
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$BUILD_STATUS"

      - name: Verify the bundle carries the release version
        if: steps.release_build.outputs.superseded != 'true'
        run: |
          BUILT="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/Edith.app/Contents/Info.plist)"
          test "$BUILT" = "$RELEASE_VERSION" \
            || { echo "release blocked: built $BUILT, expected $RELEASE_VERSION" >&2; exit 1; }

      - name: Verify the release bundle
        if: steps.release_build.outputs.superseded != 'true'
        run: make verify-bundle

      - name: Package the DMG
        if: steps.release_build.outputs.superseded != 'true'
        run: |
          rm -rf dmg-root && mkdir dmg-root
          ditto dist/Edith.app dmg-root/Edith.app
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname Edith -srcfolder dmg-root -format ULMO Edith.dmg
          verify_status=1
          for attempt in 1 2 3 4 5; do
            if hdiutil verify Edith.dmg; then
              verify_status=0
              break
            else
              verify_status=$?
            fi
            if [ "$attempt" -lt 5 ]; then
              sleep 2
            fi
          done
          rm -rf dmg-root
          exit "$verify_status"

      - name: Notarize and staple
        if: steps.release_build.outputs.superseded != 'true' && env.HAS_NOTARY == 'true'
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
        run: |
          printf '%s' "$NOTARY_KEY" > "$RUNNER_TEMP/notary-key.p8"
          xcrun notarytool submit Edith.dmg --wait \
            --key "$RUNNER_TEMP/notary-key.p8" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID"
          xcrun stapler staple Edith.dmg
          rm -f "$RUNNER_TEMP/notary-key.p8"

      - name: Generate the signed appcast
        if: steps.release_build.outputs.superseded != 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          GENERATE_APPCAST="$(find build/SourcePackages/artifacts -type f -name generate_appcast -perm -u+x -print -quit)"
          test -n "$GENERATE_APPCAST" \
            || { echo "release blocked: generate_appcast is missing" >&2; exit 1; }
          rm -rf dist/appcast && mkdir dist/appcast
          cp Edith.dmg dist/appcast/
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$GENERATE_APPCAST" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/" \
            dist/appcast
          test -f dist/appcast/appcast.xml \
            || mv dist/appcast/appcast dist/appcast/appcast.xml
          grep -q "url=\"https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/Edith.dmg\"" \
            dist/appcast/appcast.xml \
            || { echo "release blocked: appcast points at the wrong DMG" >&2; exit 1; }
          grep -q 'sparkle:edSignature=' dist/appcast/appcast.xml \
            || { echo "release blocked: appcast is not signed" >&2; exit 1; }

      - name: Verify code signatures
        if: steps.release_build.outputs.superseded != 'true'
        run: codesign --verify --deep --strict dist/Edith.app

      - name: Verify notarized disk image
        if: steps.release_build.outputs.superseded != 'true' && env.HAS_NOTARY == 'true'
        run: spctl -a -t open --context context:primary-signature Edith.dmg

      - name: Stage macOS release assets
        if: steps.release_build.outputs.superseded != 'true'
        run: |
          mkdir release-macos
          cp Edith.dmg release-macos/
          cp dist/appcast/appcast.xml release-macos/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: steps.release_build.outputs.superseded != 'true'
        with:
          name: release-macos
          compression-level: 0
          path: release-macos/*
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: steps.release_build.outputs.superseded != 'true'
        with:
          name: release-plists
          path: Resources/*Info.plist
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish release
    needs: [version, dmg, checks, swift-test, companion, promo-video, swift-build]
    if: >-
      !cancelled()
      && needs.version.result == 'success'
      && needs.dmg.result == 'success'
      && needs.dmg.outputs.superseded != 'true'
      && needs.checks.result == 'success'
      && contains(fromJSON('["success","skipped"]'), needs.swift-test.result)
      && contains(fromJSON('["success","skipped"]'), needs.companion.result)
      && contains(fromJSON('["success","skipped"]'), needs.promo-video.result)
      && contains(fromJSON('["success","skipped"]'), needs.swift-build.result)
    runs-on: ubuntu-latest
    concurrency:
      group: release-publication
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      REBUILD: ${{ inputs.rebuild }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      RELEASE_BUILD: ${{ needs.version.outputs.build }}
      BUILT_SHA: ${{ needs.version.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.version.outputs.sha }}
          path: release-source
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PUSH_TOKEN }}
          persist-credentials: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-macos
          path: release-assets

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-plists
          path: release-plists

      - name: Verify release assets
        run: |
          test -f release-assets/Edith.dmg
          test -f release-assets/appcast.xml
          test -f release-plists/Info.plist
          test -f release-plists/HelperInfo.plist

      - name: Commit and tag the release
        id: release_state
        if: env.REBUILD == ''
        working-directory: release-source
        run: |
          if [ -z "$RELEASE_VERSION" ] || [ -z "$RELEASE_TAG" ]; then
            echo "release blocked: the version job produced no version" >&2
            exit 1
          fi
          RELEASE_SHA256="$(sha256sum ../release-assets/Edith.dmg | cut -d' ' -f1)"
          export RELEASE_SHA256
          export RELEASE_PLISTS_DIR="$GITHUB_WORKSPACE/release-plists"
          PUBLISH_STATUS=0
          bash ../scripts/publish-release-state.sh cut || PUBLISH_STATUS=$?
          if [ "$PUBLISH_STATUS" -eq 75 ]; then
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$PUBLISH_STATUS"

      - name: Update the rebuilt release checksum
        if: env.REBUILD != ''
        working-directory: release-source
        run: |
          RELEASE_SHA256="$(sha256sum ../release-assets/Edith.dmg | cut -d' ' -f1)"
          export RELEASE_SHA256
          bash ../scripts/publish-release-state.sh rebuild

      - name: Publish the release
        if: steps.release_state.outputs.superseded != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" --clobber \
              release-assets/Edith.dmg release-assets/appcast.xml
          else
            gh release create "$RELEASE_TAG" --title "Edith $RELEASE_TAG" --generate-notes \
              release-assets/Edith.dmg release-assets/appcast.xml
          fi

      - name: Mirror the cask to the tap repository
        if: steps.release_state.outputs.superseded != 'true'
        env:
          TAP_PUSH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
        run: |
          git clone --depth 1 \
            "https://x-access-token:${TAP_PUSH_TOKEN}@github.com/pulkitxm/homebrew-tap.git" tap
          cp release-source/Casks/edith.rb tap/Casks/edith.rb
          cd tap
          if git diff --quiet -- Casks/edith.rb; then
            echo "the tap already carries $RELEASE_TAG"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/edith.rb
          git commit -m "Update the Edith cask to ${RELEASE_TAG}"
          git push origin HEAD:main
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)" \
            || { echo "release blocked: the tap did not take $RELEASE_TAG" >&2; exit 1; }
