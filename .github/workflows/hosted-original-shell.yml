name: Hosted original shell journey
"on":
  workflow_call:
    inputs:
      expected_sha:
        required: true
        type: string
    secrets:
      MACOS_CERT_P12:
        required: true
      MACOS_CERT_PASSWORD:
        required: true
permissions:
  contents: read
concurrency:
  group: hosted-original-shell-journey
  cancel-in-progress: false
jobs:
  calendar-journey:
    if: github.repository == 'pulkitxm/edith' && github.event_name == 'workflow_dispatch' && (github.actor_id == '65671483' || github.actor_id == '320458784') && github.ref == 'refs/heads/feat/hosted-original-shell-journey'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      EXTENSION_SWIFT_JOBS: "1"
      EDITH_HOSTED_SHELL_JOURNEY: "1"
      EDITH_MAKE_GATE: skip
      EXPECTED_SOURCE_SHA: "${{ inputs.expected_sha }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: "${{ github.sha }}"
          persist-credentials: false
      - name: Admit only the reviewed disposable hosted ref
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = macOS
          test "$(uname -m)" = arm64
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Verify owned fixture contracts
        run: |
          set -euo pipefail
          swift test --package-path Tests/HostedOriginalShell --jobs 1
          bun test scripts/hosted-original-shell-overlay.test.js scripts/hosted-original-shell-preparation.test.js
      - name: Import signing into an owned disposable keychain
        env:
          MACOS_CERT_P12: "${{ secrets.MACOS_CERT_P12 }}"
          MACOS_CERT_PASSWORD: "${{ secrets.MACOS_CERT_PASSWORD }}"
        run: |
          set -euo pipefail
          test -n "$MACOS_CERT_P12"
          test -n "$MACOS_CERT_PASSWORD"
          keychain="$RUNNER_TEMP/hosted-original-shell.keychain-db"
          test ! -e "$keychain"
          security create-keychain -p "$MACOS_CERT_PASSWORD" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$MACOS_CERT_PASSWORD" "$keychain"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/hosted-original-shell.p12"
          security import "$RUNNER_TEMP/hosted-original-shell.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MACOS_CERT_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain"
          rm "$RUNNER_TEMP/hosted-original-shell.p12"
      - name: Build the original shell with isolated fixture dependencies
        run: bun scripts/hosted-original-shell/build-journey.mjs --build-only
      - name: Click the original workflow and Calendar lifecycle
        run: bun scripts/hosted-original-shell/run-journey.mjs
      - name: Retain bounded synthetic outcomes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hosted-original-shell-outcome
          retention-days: 3
          path: |
            local/hosted-original-shell/build-receipt.json
            local/hosted-original-shell/result.json
            local/hosted-original-shell/state.json
            local/hosted-original-shell/journey-outcome.json
      - name: Remove the owned disposable signing keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/hosted-original-shell.p12"
          keychain="$RUNNER_TEMP/hosted-original-shell.keychain-db"
          if [ -e "$keychain" ]; then
            security delete-keychain "$keychain"
          fi
