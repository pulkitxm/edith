name: Export signing secrets

on:
  workflow_dispatch:
    inputs:
      recipient:
        description: Base64 of an RSA public key (PEM) that wraps the payload
        required: true
        type: string

permissions:
  contents: read

jobs:
  export:
    name: Encrypt and upload
    runs-on: ubuntu-latest
    steps:
      - name: Encrypt the signing material for the caller
        env:
          RECIPIENT_B64: ${{ inputs.recipient }}
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -eu
          work="$(mktemp -d)"
          bundle="$(mktemp -d)"
          printf '%s' "$RECIPIENT_B64" | base64 -d > "$work/public.pem"
          printf '%s' "$MACOS_CERT_P12" > "$bundle/MACOS_CERT_P12"
          printf '%s' "$MACOS_CERT_PASSWORD" > "$bundle/MACOS_CERT_PASSWORD"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$bundle/SPARKLE_PRIVATE_KEY"
          tar -C "$bundle" -cf "$work/payload.tar" .
          openssl rand -out "$work/sym.key" 32
          openssl enc -aes-256-cbc -pbkdf2 -pass "file:$work/sym.key" \
            -in "$work/payload.tar" -out payload.enc
          openssl pkeyutl -encrypt -pubin -inkey "$work/public.pem" \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in "$work/sym.key" -out sym.key.enc
          rm -rf "$bundle" "$work"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: signing-secrets
          path: |
            payload.enc
            sym.key.enc
          if-no-files-found: error
          retention-days: 1
