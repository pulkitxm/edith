name: Contributors

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: contributors
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  refresh:
    name: Refresh contributors
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          token: ${{ secrets.RELEASE_PUSH_TOKEN }}
          persist-credentials: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Rewrite the contributor list
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/contributors.mjs

      - name: Commit when the list moved
        run: |
          if git diff --quiet -- README.md; then
            echo "the contributor list is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Refresh the contributor list"
          git push origin HEAD:main
