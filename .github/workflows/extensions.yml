name: Extensions
"on":
  workflow_call:
    inputs:
      publish:
        type: boolean
        required: false
        default: false
      validation_sha:
        type: string
        required: false
        default: ""
    secrets:
      EXTENSION_CATALOG_PRIVATE_KEY:
        required: false
      MACOS_CERT_P12:
        required: false
      MACOS_CERT_PASSWORD:
        required: false
      NOTARY_ISSUER_ID:
        required: false
      NOTARY_KEY:
        required: false
      NOTARY_KEY_ID:
        required: false
      RELEASE_PUSH_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified packages and the signed catalog from this ref
        type: boolean
        required: true
        default: false
      validation_sha:
        description: Validate every extension at this exact source SHA without publishing
        type: string
        required: false
        default: ""
permissions:
  contents: read
env:
  EXTENSION_CATALOG_PUBLIC_KEY: ZmEn7Nvq56SkxwSOm7ey0kyBdFERSQgDywlDCuvxZgk=
jobs:
  tests:
    if: "!cancelled() && needs.plan.result == 'success' && (needs.plan.outputs.changed == 'true' || (needs.plan.outputs.changed == 'false' && needs.plan.outputs.draft == 'true'))"
    needs:
      - plan
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - run: bun scripts/extension-host-abi.mjs --check
      - run: bun install --frozen-lockfile
      - name: Cache the host build
        if: "needs.plan.outputs.mode == 'validation'"
        uses: ./.github/actions/cache-host
      - name: Validate the full host before all-extension validation
        if: "needs.plan.outputs.mode == 'validation'"
        run: make ci-host host
      - name: Build the marketplace harness
        run: swift build --package-path Packages/ExtensionMarketplace --build-system native --jobs 2 --product MarketplaceHarness
      - name: Verify native cache integrity and private SDK composition
        if: "needs.plan.outputs.mode == 'validation'"
        timeout-minutes: 20
        env:
          EXTENSION_SUPPORT_NATIVE_TESTS: "1"
          EXTENSION_SWIFT_JOBS: "2"
        run: |
          source scripts/ci-setup-zig.sh
          bun test scripts/extension-ghostty-native.test.js scripts/build-extension-support.native.test.js
      - name: Run make ci-marketplace-runtime ci-extension-support ci-extension-docs ci-comments
        if: "needs.plan.outputs.mode == 'validation'"
        run: make ci-marketplace-runtime ci-extension-support ci-extension-docs ci-comments
      - name: Validate the shipping extension and marketplace
        if: "needs.plan.outputs.mode != 'validation'"
        run: make ci-marketplace-runtime ci-extension-keep-awake ci-comments
      - run: bun scripts/test-extension-catalog-retention.mjs
      - run: bun scripts/test-extension-marketplace.mjs
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: "${{ steps.plan.outputs.matrix }}"
      batches: "${{ steps.plan.outputs.batches }}"
      changed: "${{ steps.plan.outputs.changed }}"
      draft: "${{ steps.plan.outputs.draft }}"
      mode: "${{ steps.plan.outputs.mode }}"
      source_sha: "${{ steps.plan.outputs.source_sha }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Admit exact-source all-extension validation
        if: "inputs.validation_sha != ''"
        env:
          EXTENSION_VALIDATION_SHA: "${{ inputs.validation_sha }}"
          EXTENSION_PUBLISH: "${{ inputs.publish }}"
        run: bun scripts/extension-release-plan.mjs --check-validation-source "$EXTENSION_VALIDATION_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - run: node --test scripts/verify-extension-catalog.test.mjs
      - name: Check portable publication and selective planning
        run: bun test scripts/extension-publication-guard.test.js scripts/extension-release-plan.test.js scripts/extension-build-batches.test.js scripts/extensions-workflow.test.js scripts/extension-all-validation.test.js
      - run: bun scripts/extension-host-abi.mjs --check
      - name: Require production publication from main
        if: "!inputs.validation_sha && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true))"
        run: 'test "$GITHUB_REF" = refs/heads/main || { echo "Extension publication requires main" >&2; exit 1; }'
      - name: Plan against the exact PR base or last trusted catalog
        id: plan
        env:
          GH_TOKEN: "${{ github.token }}"
          PR_BASE_SHA: "${{ github.event.pull_request.base.sha }}"
          EXTENSION_VALIDATION_SHA: "${{ inputs.validation_sha }}"
          EXTENSION_PUBLISH: "${{ inputs.publish }}"
        run: |
          mkdir -p dist/extensions
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            [[ "$PR_BASE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "Invalid pull request base commit" >&2; exit 1; }
            git fetch --no-tags origin "$PR_BASE_SHA"
            bun scripts/extension-release-plan.mjs --pull-request-base "$PR_BASE_SHA" > dist/extensions/plan.json
            draft=false
          elif [ -n "$EXTENSION_VALIDATION_SHA" ]; then
            bun scripts/extension-release-plan.mjs --validate-all "$EXTENSION_VALIDATION_SHA" > dist/extensions/plan.json
            draft=false
          else
            node scripts/extension-publish.mjs --read-catalog dist/extensions/previous.json
            bun scripts/extension-release-plan.mjs dist/extensions/previous.json > dist/extensions/plan.json
            draft="$(bun -e 'console.log(JSON.parse(await Bun.file("dist/extensions/previous-state.json").text()).draft)')"
          fi
          {
            echo "matrix=$(bun -e 'const plan=JSON.parse(await Bun.file("dist/extensions/plan.json").text()); console.log(JSON.stringify({include:plan.include}))')"
            echo "batches=$(bun scripts/extension-build-batches.mjs dist/extensions/plan.json)"
            echo "changed=$(bun -e 'console.log(JSON.parse(await Bun.file("dist/extensions/plan.json").text()).include.length > 0)')"
            echo "draft=$draft"
            echo "mode=$(bun -e 'console.log(JSON.parse(await Bun.file("dist/extensions/plan.json").text()).mode ?? "selective")')"
            echo "source_sha=$(bun -e 'console.log(JSON.parse(await Bun.file("dist/extensions/plan.json").text()).sourceSHA ?? "")')"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: extension-plan
          path: "dist/extensions/previous.json\ndist/extensions/previous-state.json\ndist/extensions/plan.json\n"
          retention-days: 7
  build:
    name: "build (${{ matrix.ids }})"
    needs:
      - plan
    if: "!cancelled() && needs.plan.result == 'success' && needs.plan.outputs.changed == 'true'"
    env:
      HAS_NOTARY: "${{ secrets.NOTARY_KEY_ID != '' && secrets.NOTARY_ISSUER_ID != '' && secrets.NOTARY_KEY != '' }}"
      EXTENSION_IDS: "${{ matrix.ids }}"
    strategy:
      fail-fast: false
      matrix: "${{ fromJSON(needs.plan.outputs.batches) }}"
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - run: bun scripts/extension-host-abi.mjs --check
      - name: Require native packages
        run: |
          for id in $EXTENSION_IDS; do
            EXTENSION_ID="$id" bun -e 'const entry=JSON.parse(await Bun.file("Extensions/manifest.json").text()).find(item=>item.id===process.env.EXTENSION_ID); if (entry?.contractVersion!==1 || entry.surfaceContractVersion!==1) throw new Error("Only native extensions can ship: " + process.env.EXTENSION_ID)'
          done
      - name: Identify optional native prerequisites
        id: native
        run: |
          ghostty="$(bun -e 'const ids=new Set(process.env.EXTENSION_IDS.split(" ")); console.log(JSON.parse(await Bun.file("Extensions/manifest.json").text()).some(item=>ids.has(item.id)&&item.nativeProduct==="GhosttyTerminal"))')"
          echo "ghostty=$ghostty" >> "$GITHUB_OUTPUT"
      - name: Identify the optional terminal toolchain
        if: "steps.native.outputs.ghostty == 'true'"
        id: ghostty-toolchain
        run: |
          source scripts/ci-setup-zig.sh
          echo "fingerprint=$(node scripts/extension-ghostty-native.mjs --fingerprint)" >> "$GITHUB_OUTPUT"
      - name: Cache the optional terminal library
        if: "steps.native.outputs.ghostty == 'true'"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: Extensions/terminal/Native/vendor
          key: "ghostty-extension-${{ runner.os }}-${{ runner.arch }}-${{ steps.ghostty-toolchain.outputs.fingerprint }}-${{ hashFiles('scripts/build-ghostty.sh', 'scripts/patches/ghostty-external-io.patch', 'scripts/extension-ghostty-native.mjs', 'Extensions/terminal/Native/Package.swift') }}"
      - name: Build the optional terminal library
        if: "steps.native.outputs.ghostty == 'true'"
        run: |
          make ghostty-extension
          node scripts/extension-ghostty-native.mjs --check
          bun test scripts/extension-ghostty-native.test.js
      - name: Identify the support build toolchain
        id: support-toolchain
        run: |
          fingerprint="$( { xcodebuild -version; swift --version; xcrun --sdk macosx --show-sdk-version; } | shasum -a 256 | cut -d ' ' -f 1)"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      - name: "Reuse this batch's unchanged support libraries"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: "${{ matrix.supportPaths }}"
          key: "extension-support-v5-${{ runner.os }}-${{ runner.arch }}-${{ steps.support-toolchain.outputs.fingerprint }}-${{ matrix.supportKey }}"
          restore-keys: "extension-support-v5-${{ runner.os }}-${{ runner.arch }}-${{ steps.support-toolchain.outputs.fingerprint }}-"
      - name: "Test this batch's optional native packages"
        env:
          EXTENSION_PACKAGE_SUITES: "${{ (!inputs.validation_sha && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true))) && 'skip' || 'run' }}"
        run: |
          failed=""
          for id in $EXTENSION_IDS; do
            echo "::group::Test $id"
            bun scripts/test-extension-package.mjs "$id" || { echo "::error title=Extension tests failed::$id"; failed="$failed $id"; }
            echo "::endgroup::"
          done
          test -z "$failed" || { echo "Extension package tests failed:$failed" >&2; exit 1; }
      - name: Import the release signing certificate
        if: "!inputs.validation_sha && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true))"
        env:
          MACOS_CERT_P12: "${{ secrets.MACOS_CERT_P12 }}"
          MACOS_CERT_PASSWORD: "${{ secrets.MACOS_CERT_PASSWORD }}"
        run: |
          test -n "$MACOS_CERT_P12"
          keychain="$RUNNER_TEMP/extensions.keychain-db"
          security create-keychain -p "$MACOS_CERT_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$MACOS_CERT_PASSWORD" "$keychain"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MACOS_CERT_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain"
          rm "$RUNNER_TEMP/cert.p12"
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)"
          if [ -z "$identity" ]; then
            identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Apple Development:.*\)"/\1/p' | head -n 1)"
          fi
          test -n "$identity"
          echo "EXTENSION_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Cache the host that contains the camera carrier
        if: "matrix.camera"
        uses: ./.github/actions/cache-host
      - name: Build the host that contains the camera carrier
        if: "matrix.camera"
        run: make host
      - name: Sign the containing host for publication
        if: "matrix.camera && !inputs.validation_sha && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true))"
        run: python3 scripts/package-shipping-host.py local/minimal-host/Edith.app local/extension-release-host/Edith.app --identity "$EXTENSION_SIGN_IDENTITY" --release
      - name: Build only this batch's extensions
        env:
          EXTENSION_BUILDS: "${{ matrix.builds }}"
          DEVELOPMENT: "${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.publish != true) }}"
          EXTENSION_SWIFT_JOBS: "3"
          EXTENSION_CONTAINING_HOST_APP: "${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.publish != true)) && 'local/minimal-host/Edith.app' || 'local/extension-release-host/Edith.app' }}"
        run: |
          failed=""
          for build in $EXTENSION_BUILDS; do
            id="${build%%=*}"
            flags=""
            if [ "$DEVELOPMENT" = true ]; then flags="--development"; fi
            echo "::group::Build $id"
            EXTENSION_VERSION="${build#*=}" bun scripts/build-extension-package.mjs "$id" $flags || { echo "::error title=Extension build failed::$id"; failed="$failed $id"; }
            echo "::endgroup::"
          done
          df -h "$GITHUB_WORKSPACE" | tail -1
          test -z "$failed" || { echo "Extension packages failed to build:$failed" >&2; exit 1; }
      - name: Notarize the downloaded packages
        if: "${{ !inputs.validation_sha && env.HAS_NOTARY == 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true)) }}"
        env:
          NOTARY_KEY: "${{ secrets.NOTARY_KEY }}"
          NOTARY_KEY_ID: "${{ secrets.NOTARY_KEY_ID }}"
          NOTARY_ISSUER_ID: "${{ secrets.NOTARY_ISSUER_ID }}"
        run: |
          test -n "$NOTARY_KEY"
          test -n "$NOTARY_KEY_ID"
          test -n "$NOTARY_ISSUER_ID"
          printf '%s' "$NOTARY_KEY" > "$RUNNER_TEMP/notary-key.p8"
          trap 'rm -f "$RUNNER_TEMP/notary-key.p8"' EXIT
          for id in $EXTENSION_IDS; do
            xcrun notarytool submit "dist/extensions/$id.zip" --wait --key "$RUNNER_TEMP/notary-key.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: "extension-batch-${{ matrix.batch }}"
          path: dist/extensions/*.*
          retention-days: 7
      - name: Remove the temporary signing keychain
        if: always()
        run: "security delete-keychain \"$RUNNER_TEMP/extensions.keychain-db\" || true"
  publish:
    timeout-minutes: 360
    concurrency:
      group: extensions-publish
      cancel-in-progress: false
    permissions:
      contents: read
    needs:
      - plan
      - build
      - tests
    if: "!cancelled() && !inputs.validation_sha && needs.plan.outputs.mode != 'validation' && github.repository == 'pulkitxm/edith' && github.event_name != 'pull_request' && needs.plan.result == 'success' && needs.tests.result == 'success' && ((needs.plan.outputs.changed == 'true' && needs.build.result == 'success') || (needs.plan.outputs.changed == 'false' && needs.plan.outputs.draft == 'true' && needs.build.result == 'skipped')) && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish == true && github.ref == 'refs/heads/main'))"
    runs-on: macos-26
    env:
      GH_TOKEN: "${{ secrets.RELEASE_PUSH_TOKEN }}"
      GITHUB_TOKEN: "${{ github.token }}"
      EXTENSION_CATALOG_PRIVATE_KEY: "${{ secrets.EXTENSION_CATALOG_PRIVATE_KEY }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - run: bun scripts/extension-host-abi.mjs --check
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: extension-*
          path: dist/extensions
          merge-multiple: true
      - name: Install the release client
        run: bash scripts/install-release-client.sh
      - name: Inspect release capabilities
        run: |
          pukbot capabilities --json
          pukbot tag create --help
          pukbot release create --help
          pukbot release edit --help
          pukbot release upload-asset --help
          gh release upload --help
      - name: Install verified release dependencies
        run: bun install --frozen-lockfile
      - name: Publish immutable extension releases and the signed catalog
        run: |
          set -o pipefail
          LOG="$RUNNER_TEMP/extension-publish.log"
          if bun scripts/extension-publish.mjs 2>&1 | tee "$LOG"; then exit 0; fi
          if grep -q "Extension publication superseded: main changed" "$LOG"; then
            echo "::notice title=Extension publication superseded::A newer main commit will publish the catalog."
            exit 0
          fi
          exit 1
