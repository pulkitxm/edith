name: Pull request

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: Conventional title
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            style
            test
            build
            ci
            chore
            security
            revert
          requireScope: false
          subjectPattern: "^[a-z].*[^.]$"
          subjectPatternError: >-
            The subject "{subject}" should start lowercase and end without a full stop.

  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Every commit follows the convention
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          pattern='^(feat|fix|perf|refactor|docs|style|test|build|ci|chore|security|revert)(\([a-z0-9._-]+\))?!?: [a-z].{0,71}$'
          rc=0
          while read -r sha; do
            subject=$(git log -1 --format=%s "${sha}")
            case "${subject}" in
              Merge*) continue ;;
            esac
            if ! printf '%s' "${subject}" | grep -qE "${pattern}"; then
              echo "${sha}: ${subject}" >&2
              rc=1
            fi
          done < <(git rev-list "${BASE_SHA}..${HEAD_SHA}")
          if [ "${rc}" -ne 0 ]; then
            echo 'commit subjects must be conventional, lowercase, and at most 72 characters' >&2
          fi
          exit "${rc}"

  history:
    name: Linear history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Branch carries no merge commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          merges=$(git rev-list --merges "${BASE_SHA}..${HEAD_SHA}")
          if [ -n "${merges}" ]; then
            echo "${merges}" >&2
            echo 'rebase instead of merging the base branch' >&2
            exit 1
          fi
