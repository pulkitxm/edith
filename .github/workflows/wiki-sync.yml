name: Wiki

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/sync-wiki.mjs"
      - ".github/workflows/wiki-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-sync
  cancel-in-progress: true

jobs:
  sync:
    name: Sync wiki
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Require main for manual sync
        if: github.event_name == 'workflow_dispatch'
        run: >-
          test "$GITHUB_REF" = refs/heads/main
          || { echo "sync blocked: select the main branch" >&2; exit 1; }
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.PUKBOT_CLIENT_ID }}
          private-key: ${{ secrets.PUKBOT_PRIVATE_KEY }}
          owner: pulkitxm
          repositories: edith
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - run: bun scripts/sync-wiki.mjs --push
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_AUTHOR_NAME: "pukbot[bot]"
          GIT_AUTHOR_EMAIL: "320458784+pukbot[bot]@users.noreply.github.com"
