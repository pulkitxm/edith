name: Hosted host test diagnostics
"on":
  workflow_dispatch:
    inputs:
      expected_sha:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: hosted-host-test-diagnostics
  cancel-in-progress: false
jobs:
  serial-core-and-ui:
    if: github.repository == 'pulkitxm/edith' && (github.actor_id == '65671483' || github.actor_id == '320458784') && github.ref == 'refs/heads/feat/hosted-host-test-diagnostics' && inputs.expected_sha == github.sha
    runs-on: macos-26
    timeout-minutes: 40
    env:
      EDITH_HOSTED_HOST_TESTS: "1"
      EXPECTED_SOURCE_SHA: "${{ inputs.expected_sha }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: "${{ github.sha }}"
          persist-credentials: false
      - name: Verify pure watchdog admission and ownership contracts
        run: python3 -m unittest discover -s scripts/hosted-host-tests -p 'test_*.py'
      - name: Build then run required serial Core and UI batches
        run: python3 scripts/hosted-host-tests/watchdog.py
      - name: Retain bounded hosted diagnostic outcome
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hosted-host-test-diagnostics
          retention-days: 3
          path: local/hosted-host-tests/
