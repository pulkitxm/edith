name: Hosted host test diagnostics
"on":
  workflow_call:
    inputs:
      expected_sha:
        required: true
        type: string
      release:
        required: true
        type: boolean
      rebuild:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: hosted-host-test-diagnostics
  cancel-in-progress: false
jobs:
  serial-core-and-ui:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'pulkitxm/edith' && (github.actor_id == '65671483' || github.actor_id == '320458784') && (github.ref == 'refs/heads/feat/hosted-host-test-diagnostics' || github.ref == 'refs/heads/feat/hosted-journey-registration' || github.ref == 'refs/heads/feat/extension-marketplace' || github.ref == 'refs/heads/main') && inputs.expected_sha == github.sha && !inputs.release && inputs.rebuild == ''
    runs-on: macos-26
    timeout-minutes: 50
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      EDITH_HOSTED_HOST_TESTS: "1"
      EXPECTED_SOURCE_SHA: "${{ inputs.expected_sha }}"
      EDITH_HOSTED_RELEASE: "${{ inputs.release }}"
      EDITH_HOSTED_REBUILD: "${{ inputs.rebuild }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: "${{ github.sha }}"
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Verify pure watchdog admission and ownership contracts
        run: python3 -m unittest discover -s scripts/hosted-host-tests -p 'test_*.py'
      - name: Build then run required serial Core and UI batches
        run: python3 scripts/hosted-host-tests/watchdog.py
      - name: Diagnose required Marketplace runtime tests with owned process deadlines
        run: make ci-marketplace-runtime-diagnostics
      - name: Retain bounded hosted diagnostic outcome
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hosted-host-test-diagnostics
          retention-days: 3
          path: |
            local/hosted-host-tests/
            local/hosted-marketplace-tests/
