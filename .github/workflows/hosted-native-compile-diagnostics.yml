name: Hosted native compile diagnostics
"on":
  workflow_call:
    inputs:
      expected_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  attention-compile:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'pulkitxm/edith' && (github.actor_id == '65671483' || github.actor_id == '320458784') && (github.ref == 'refs/heads/feat/extension-marketplace' || github.ref == 'refs/heads/main') && inputs.expected_sha == github.sha
    runs-on: macos-26
    timeout-minutes: 30
    env:
      EXPECTED_SOURCE_SHA: "${{ inputs.expected_sha }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: "${{ github.sha }}"
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Compile original Attention tests with verbose compiler diagnostics
        run: python3 scripts/hosted-native-compile-diagnostics.py
      - name: Retain compile outcome and bounded new compiler crash reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hosted-attention-compile-diagnostics
          retention-days: 3
          path: local/hosted-native-compile/
