name: Release

on:
  workflow_call:
    inputs:
      cut_release:
        description: "Permit a fully gated CI run to cut the next release."
        type: boolean
        required: false
        default: false
      rebuild:
        description: "Existing tag to rebuild and re-upload. Empty cuts the next patch release."
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Current release tag to rebuild and re-upload."
        type: string
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      build: ${{ steps.resolve.outputs.build }}
      sha: ${{ steps.resolve.outputs.sha }}
    env:
      REBUILD: ${{ inputs.rebuild }}
      CUT_RELEASE: ${{ inputs.cut_release }}
      WORKFLOW_REF: ${{ github.ref }}
      HAS_SIGNING: ${{ secrets.MACOS_CERT_P12 != '' }}
      HAS_SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY != '' }}
      HAS_PUSH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN != '' }}
      HAS_TAP_TOKEN: ${{ secrets.TAP_PUSH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.rebuild && format('refs/tags/{0}', inputs.rebuild) || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require release secrets
        run: |
          test "$WORKFLOW_REF" = refs/heads/main \
            || { echo "release blocked: run the workflow from main" >&2; exit 1; }
          if [ -z "$REBUILD" ]; then
            test "$CUT_RELEASE" = true \
              || { echo "release blocked: new releases must pass through CI" >&2; exit 1; }
          fi
          test "$HAS_SIGNING" = true \
            || { echo "release blocked: MACOS_CERT_P12 is required" >&2; exit 1; }
          test "$HAS_SPARKLE_KEY" = true \
            || { echo "release blocked: SPARKLE_PRIVATE_KEY is required" >&2; exit 1; }
          test "$HAS_PUSH_TOKEN" = true \
            || { echo "release blocked: RELEASE_PUSH_TOKEN is required" >&2; exit 1; }
          test "$HAS_TAP_TOKEN" = true \
            || { echo "release blocked: TAP_PUSH_TOKEN is required" >&2; exit 1; }

      - name: Resolve the version to release
        id: resolve
        run: |
          read -r VERSION BUILD <<<"$(python3 - <<'PY'
          import plistlib
          with open("Resources/Info.plist", "rb") as plist:
              info = plistlib.load(plist)
          print(info["CFBundleShortVersionString"], info["CFBundleVersion"])
          PY
          )"

          if [ -n "$REBUILD" ]; then
            git rev-parse "refs/tags/$REBUILD^{commit}" >/dev/null \
              || { echo "release blocked: $REBUILD is not a release tag" >&2; exit 1; }
            test "v$VERSION" = "$REBUILD" \
              || { echo "release blocked: $REBUILD carries version $VERSION" >&2; exit 1; }
            {
              echo "tag=$REBUILD"
              echo "version=$VERSION"
              echo "build=$BUILD"
              echo "sha=$(git rev-parse HEAD)"
            } >> "$GITHUB_OUTPUT"
            echo "Rebuilding $REBUILD"
            exit 0
          fi

          case "$VERSION" in
            *.*.*) ;;
            *) echo "release blocked: version $VERSION is not major.minor.patch" >&2; exit 1 ;;
          esac
          MAJOR="${VERSION%%.*}"
          REST="${VERSION#*.}"
          MINOR="${REST%%.*}"
          PATCH="${REST#*.}"
          case "$MAJOR$MINOR$PATCH$BUILD" in
            *[!0-9]*) echo "release blocked: version $VERSION build $BUILD is not numeric" >&2; exit 1 ;;
          esac
          NEXT="$MAJOR.$MINOR.$((PATCH + 1))"
          if git rev-parse "refs/tags/v$NEXT" >/dev/null 2>&1; then
            echo "release blocked: tag v$NEXT already exists" >&2
            exit 1
          fi
          {
            echo "tag=v$NEXT"
            echo "version=$NEXT"
            echo "build=$((BUILD + 1))"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION -> $NEXT (build $((BUILD + 1)))"

  dmg:
    needs: version
    runs-on: macos-26
    env:
      HAS_NOTARY: ${{ secrets.NOTARY_KEY_ID != '' && secrets.NOTARY_ISSUER_ID != '' && secrets.NOTARY_KEY != '' }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      RELEASE_BUILD: ${{ needs.version.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false

      - name: Stamp the release version
        run: |
          for plist in Resources/Info.plist Resources/HelperInfo.plist; do
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $RELEASE_VERSION" "$plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $RELEASE_BUILD" "$plist"
          done

      - name: Import signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/edith-signing.keychain-db"
          security create-keychain -p "$MACOS_CERT_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$MACOS_CERT_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MACOS_CERT_PASSWORD" "$KEYCHAIN"
          KEYCHAINS=("$KEYCHAIN")
          while IFS= read -r keychain; do
            KEYCHAINS+=("${keychain//\"/}")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${KEYCHAINS[@]}"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build the app
        env:
          EDITH_RELEASE_ALLOW_DEV_SIGNING: "1"
        run: ./build.sh --no-open --release

      - name: Verify the bundle carries the release version
        run: |
          BUILT="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/Edith.app/Contents/Info.plist)"
          test "$BUILT" = "$RELEASE_VERSION" \
            || { echo "release blocked: built $BUILT, expected $RELEASE_VERSION" >&2; exit 1; }

      - name: Package the DMG
        run: |
          rm -rf dmg-root && mkdir dmg-root
          cp -R dist/Edith.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname Edith -srcfolder dmg-root -format UDZO Edith.dmg
          rm -rf dmg-root

      - name: Notarize and staple
        if: env.HAS_NOTARY == 'true'
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
        run: |
          printf '%s' "$NOTARY_KEY" > "$RUNNER_TEMP/notary-key.p8"
          xcrun notarytool submit Edith.dmg --wait \
            --key "$RUNNER_TEMP/notary-key.p8" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID"
          xcrun stapler staple Edith.dmg
          rm -f "$RUNNER_TEMP/notary-key.p8"

      - name: Generate the signed appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          GENERATE_APPCAST="$(find build/SourcePackages/artifacts -type f -name generate_appcast -perm -u+x -print -quit)"
          test -n "$GENERATE_APPCAST" \
            || { echo "release blocked: generate_appcast is missing" >&2; exit 1; }
          rm -rf dist/appcast && mkdir dist/appcast
          cp Edith.dmg dist/appcast/
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$GENERATE_APPCAST" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/" \
            dist/appcast
          test -f dist/appcast/appcast.xml \
            || mv dist/appcast/appcast dist/appcast/appcast.xml
          grep -q "url=\"https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/Edith.dmg\"" \
            dist/appcast/appcast.xml \
            || { echo "release blocked: appcast points at the wrong DMG" >&2; exit 1; }
          grep -q 'sparkle:edSignature=' dist/appcast/appcast.xml \
            || { echo "release blocked: appcast is not signed" >&2; exit 1; }

      - name: Verify code signatures
        run: codesign --verify --deep --strict dist/Edith.app

      - name: Verify notarized disk image
        if: env.HAS_NOTARY == 'true'
        run: spctl -a -t open --context context:primary-signature Edith.dmg

      - name: Stage macOS release assets
        run: |
          mkdir release-macos
          cp Edith.dmg release-macos/
          cp dist/appcast/appcast.xml release-macos/

      - uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: release-macos/*
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v7
        with:
          name: release-plists
          path: Resources/*Info.plist
          if-no-files-found: error
          retention-days: 1

  deb:
    needs: version
    runs-on: ubuntu-24.04
    container: swift:6.3.3-noble
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false

      - name: Install native dependencies
        run: apt-get update && apt-get install -y libgtk-4-dev desktop-file-utils appstream dpkg-dev make

      - name: Test portable core
        run: make linux-test

      - name: Validate desktop metadata
        run: make linux-metadata

      - name: Build Debian package
        run: VERSION="$RELEASE_VERSION" make linux-package

      - name: Verify and install Debian package
        run: |
          DEB="$(find dist/linux -maxdepth 1 -name 'edith_*.deb' -print -quit)"
          test -n "$DEB" || { echo "release blocked: Debian package is missing" >&2; exit 1; }
          test "$(dpkg-deb -f "$DEB" Version)" = "$RELEASE_VERSION" \
            || { echo "release blocked: Debian package has the wrong version" >&2; exit 1; }
          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB"
          apt-get install -y "./$DEB"
          edith-linux --diagnose
          mkdir release-linux
          cp "$DEB" release-linux/Edith.deb

      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: release-linux/Edith.deb
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [version, dmg, deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      REBUILD: ${{ inputs.rebuild }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      BUILT_SHA: ${{ needs.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
          path: release-source
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PUSH_TOKEN }}
          persist-credentials: true

      - uses: actions/download-artifact@v8
        with:
          name: release-macos
          path: release-assets

      - uses: actions/download-artifact@v8
        with:
          name: release-linux
          path: release-assets

      - uses: actions/download-artifact@v8
        with:
          name: release-plists
          path: release-plists

      - name: Verify release assets
        run: |
          test -f release-assets/Edith.dmg
          test -f release-assets/Edith.deb
          test -f release-assets/appcast.xml
          test -f release-plists/Info.plist
          test -f release-plists/HelperInfo.plist

      - name: Commit and tag the release
        if: env.REBUILD == ''
        working-directory: release-source
        run: |
          if [ -z "$RELEASE_VERSION" ] || [ -z "$RELEASE_TAG" ]; then
            echo "release blocked: the version job produced no version" >&2
            exit 1
          fi
          RELEASE_SHA256="$(sha256sum ../release-assets/Edith.dmg | cut -d' ' -f1)"
          export RELEASE_SHA256
          export RELEASE_PLISTS_DIR="$GITHUB_WORKSPACE/release-plists"
          ../scripts/publish-release-state.sh cut

      - name: Update the rebuilt release checksum
        if: env.REBUILD != ''
        working-directory: release-source
        run: |
          RELEASE_SHA256="$(sha256sum ../release-assets/Edith.dmg | cut -d' ' -f1)"
          export RELEASE_SHA256
          ../scripts/publish-release-state.sh rebuild

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" --clobber \
              release-assets/Edith.dmg release-assets/Edith.deb release-assets/appcast.xml
          else
            gh release create "$RELEASE_TAG" --title "Edith $RELEASE_TAG" --generate-notes \
              release-assets/Edith.dmg release-assets/Edith.deb release-assets/appcast.xml
          fi

      - name: Mirror the cask to the tap repository
        env:
          TAP_PUSH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
        run: |
          git clone --depth 1 \
            "https://x-access-token:${TAP_PUSH_TOKEN}@github.com/pulkitxm/homebrew-tap.git" tap
          cp release-source/Casks/edith.rb tap/Casks/edith.rb
          cd tap
          if git diff --quiet -- Casks/edith.rb; then
            echo "the tap already carries $RELEASE_TAG"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/edith.rb
          git commit -m "Update the Edith cask to ${RELEASE_TAG}"
          git push origin HEAD:main
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)" \
            || { echo "release blocked: the tap did not take $RELEASE_TAG" >&2; exit 1; }
