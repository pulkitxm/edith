name: Release

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-26
    env:
      HAS_SIGNING: ${{ secrets.MACOS_CERT_P12 != '' }}
      HAS_SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY != '' }}
      HAS_NOTARY: ${{ secrets.NOTARY_KEY_ID != '' && secrets.NOTARY_ISSUER_ID != '' && secrets.NOTARY_KEY != '' }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}

      - name: Require release secrets
        if: env.HAS_SIGNING != 'true' || env.HAS_SPARKLE_KEY != 'true'
        run: |
          echo "release blocked: signing and Sparkle secrets are required" >&2
          exit 1

      - name: Verify tag matches app version
        run: |
          PLIST_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          test "v$PLIST_VERSION" = "$RELEASE_TAG" \
            || { echo "tag $RELEASE_TAG does not match app version $PLIST_VERSION" >&2; exit 1; }

      - name: Import signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/edith-signing.keychain-db"
          security create-keychain -p "$MACOS_CERT_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$MACOS_CERT_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MACOS_CERT_PASSWORD" "$KEYCHAIN"
          KEYCHAINS=("$KEYCHAIN")
          while IFS= read -r keychain; do
            KEYCHAINS+=("${keychain//\"/}")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${KEYCHAINS[@]}"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build the app
        env:
          EDITH_RELEASE_ALLOW_DEV_SIGNING: "1"
        run: ./build.sh --no-open --release

      - name: Package the DMG
        run: |
          rm -rf dmg-root && mkdir dmg-root
          cp -R dist/Edith.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname Edith -srcfolder dmg-root -format UDZO Edith.dmg
          rm -rf dmg-root

      - name: Notarize and staple
        if: env.HAS_NOTARY == 'true'
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
        run: |
          printf '%s' "$NOTARY_KEY" > "$RUNNER_TEMP/notary-key.p8"
          xcrun notarytool submit Edith.dmg --wait \
            --key "$RUNNER_TEMP/notary-key.p8" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID"
          xcrun stapler staple Edith.dmg
          rm -f "$RUNNER_TEMP/notary-key.p8"

      - name: Generate the signed appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          GENERATE_APPCAST="$(find build/SourcePackages/artifacts -type f -name generate_appcast -perm -u+x -print -quit)"
          test -n "$GENERATE_APPCAST" \
            || { echo "release blocked: generate_appcast is missing" >&2; exit 1; }
          rm -rf dist/appcast && mkdir dist/appcast
          cp Edith.dmg dist/appcast/
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$GENERATE_APPCAST" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/" \
            dist/appcast
          test -f dist/appcast/appcast.xml \
            || mv dist/appcast/appcast dist/appcast/appcast.xml
          grep -q "url=\"https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/Edith.dmg\"" \
            dist/appcast/appcast.xml \
            || { echo "release blocked: appcast points at the wrong DMG" >&2; exit 1; }
          grep -q 'sparkle:edSignature=' dist/appcast/appcast.xml \
            || { echo "release blocked: appcast is not signed" >&2; exit 1; }

      - name: Verify code signatures
        run: codesign --verify --deep --strict dist/Edith.app

      - name: Verify notarized disk image
        if: env.HAS_NOTARY == 'true'
        run: spctl -a -t open --context context:primary-signature Edith.dmg

      - name: Stage macOS release assets
        run: |
          mkdir release-macos
          cp Edith.dmg release-macos/
          cp dist/appcast/appcast.xml release-macos/

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: release-macos/*
          if-no-files-found: error
          retention-days: 1

  deb:
    runs-on: ubuntu-24.04
    container: swift:6.3.2-noble
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}

      - name: Install native dependencies
        run: apt-get update && apt-get install -y libgtk-4-dev desktop-file-utils appstream dpkg-dev make

      - name: Verify tag matches app version
        run: |
          PLIST_VERSION="$(awk '/CFBundleShortVersionString/{getline; gsub(/.*<string>|<\/string>.*/, ""); print; exit}' Resources/Info.plist)"
          test "v$PLIST_VERSION" = "$RELEASE_TAG" \
            || { echo "tag $RELEASE_TAG does not match app version $PLIST_VERSION" >&2; exit 1; }

      - name: Test portable core
        run: make linux-test

      - name: Validate desktop metadata
        run: make linux-metadata

      - name: Build Debian package
        run: VERSION="${RELEASE_TAG#v}" make linux-package

      - name: Verify and install Debian package
        run: |
          DEB="$(find dist/linux -maxdepth 1 -name 'edith_*.deb' -print -quit)"
          test -n "$DEB" || { echo "release blocked: Debian package is missing" >&2; exit 1; }
          test "$(dpkg-deb -f "$DEB" Version)" = "${RELEASE_TAG#v}" \
            || { echo "release blocked: Debian package has the wrong version" >&2; exit 1; }
          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB"
          apt-get install -y "./$DEB"
          edith-linux --diagnose
          mkdir release-linux
          cp "$DEB" release-linux/Edith.deb

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release-linux/Edith.deb
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [dmg, deb]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: release-macos
          path: release-assets

      - uses: actions/download-artifact@v5
        with:
          name: release-linux
          path: release-assets

      - name: Verify release assets
        run: |
          test -f release-assets/Edith.dmg
          test -f release-assets/Edith.deb
          test -f release-assets/appcast.xml

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" --clobber \
              release-assets/Edith.dmg release-assets/Edith.deb release-assets/appcast.xml
          else
            gh release create "$RELEASE_TAG" --title "Edith $RELEASE_TAG" --generate-notes \
              release-assets/Edith.dmg release-assets/Edith.deb release-assets/appcast.xml
          fi
