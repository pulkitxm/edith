name: Hosted standard app update
"on":
  workflow_call:
    inputs:
      expected_sha:
        required: true
        type: string
      release:
        required: true
        type: boolean
      rebuild:
        required: true
        type: string
    secrets:
      MACOS_CERT_P12:
        required: true
      MACOS_CERT_PASSWORD:
        required: true
permissions:
  contents: read
concurrency:
  group: hosted-sparkle-update
  cancel-in-progress: false
jobs:
  full-archive-update:
    if: github.repository == 'pulkitxm/edith' && github.event_name == 'workflow_dispatch' && (github.actor_id == '65671483' || github.actor_id == '320458784') && (github.ref == 'refs/heads/feat/hosted-sparkle-verification' || github.ref == 'refs/heads/feat/hosted-sparkle-ui-flow' || github.ref == 'refs/heads/feat/extension-marketplace' || github.ref == 'refs/heads/main') && inputs.expected_sha == github.sha && !inputs.release && inputs.rebuild == ''
    runs-on: macos-26
    timeout-minutes: 120
    env:
      EXTENSION_SWIFT_JOBS: "1"
      EDITH_HOSTED_SPARKLE_UPDATE: "1"
      EDITH_MAKE_GATE: skip
      EXPECTED_SOURCE_SHA: "${{ inputs.expected_sha }}"
      EDITH_HOSTED_RELEASE: "${{ inputs.release }}"
      EDITH_HOSTED_REBUILD: "${{ inputs.rebuild }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: "${{ github.sha }}"
          persist-credentials: false
      - name: Admit only the reviewed disposable hosted source
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$EDITH_HOSTED_RELEASE" = false
          test -z "$EDITH_HOSTED_REBUILD"
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = macOS
          test "$(uname -m)" = arm64
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Verify sealed bootstrap and observed outcome contracts
        run: |
          set -euo pipefail
          swift test --package-path Tests/HostedSparkleUpdate --jobs 1
          bun test scripts/hosted-sparkle-update-contract.test.js scripts/hosted-sparkle-update-server.test.js scripts/hosted-sparkle-update-overlay.test.js scripts/hosted-sparkle-update-build.test.js scripts/hosted-sparkle-process-ledger.test.js scripts/hosted-sparkle-preparation.test.js scripts/hosted-sparkle-producer.test.js scripts/hosted-sparkle-control.test.js scripts/hosted-sparkle-fixed-files.test.js scripts/hosted-sparkle-ui.test.js scripts/hosted-sparkle-runner.test.js scripts/hosted-sparkle-workflow.test.js
          bun scripts/hosted-host-manifest-cold.mjs
      - name: Import signing into an owned disposable keychain
        env:
          MACOS_CERT_P12: "${{ secrets.MACOS_CERT_P12 }}"
          MACOS_CERT_PASSWORD: "${{ secrets.MACOS_CERT_PASSWORD }}"
        run: |
          set -euo pipefail
          test -n "$MACOS_CERT_P12"
          test -n "$MACOS_CERT_PASSWORD"
          keychain="$RUNNER_TEMP/hosted-sparkle-update.keychain-db"
          test ! -e "$keychain"
          security create-keychain -p "$MACOS_CERT_PASSWORD" "$keychain"
          security set-keychain-settings -lut 10800 "$keychain"
          security unlock-keychain -p "$MACOS_CERT_PASSWORD" "$keychain"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/hosted-sparkle-update.p12"
          security import "$RUNNER_TEMP/hosted-sparkle-update.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MACOS_CERT_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain"
          rm "$RUNNER_TEMP/hosted-sparkle-update.p12"
      - name: Install signed full archive through the original updater and reject altered archives
        run: bun scripts/hosted-sparkle-update/run-update.mjs
      - name: Retain bounded synthetic update outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hosted-sparkle-update-outcomes
          retention-days: 3
          path: |
            local/hosted-sparkle-update/result.json
            local/hosted-sparkle-update/case-*/result.json
            local/hosted-sparkle-update/case-*/build-receipt.json
            local/hosted-sparkle-update/case-*/journey-outcome.json
      - name: Retain completed synthetic window evidence
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hosted-sparkle-update-synthetic-windows
          retention-days: 3
          if-no-files-found: error
          path: |
            local/hosted-sparkle-update/marketplace-installed-calendar.png
            local/hosted-sparkle-update/storage-distribution.png
      - name: Remove the owned disposable signing keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/hosted-sparkle-update.p12"
          keychain="$RUNNER_TEMP/hosted-sparkle-update.keychain-db"
          if [ -e "$keychain" ]; then
            security delete-keychain "$keychain"
          fi
