name: Linux

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    container: swift:6.3.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: apt-get update && apt-get install -y libgtk-4-dev desktop-file-utils appstream dpkg-dev
      - name: Test portable core
        run: swift test --package-path Packages/Edith
      - name: Build native application
        run: swift build --package-path Packages/Edith -c release --product edith-linux
      - name: Validate desktop metadata
        run: |
          desktop-file-validate packaging/linux/com.pulkit.Edith.desktop
          appstreamcli validate --no-net packaging/linux/com.pulkit.Edith.metainfo.xml
      - name: Build Debian package
        run: packaging/debian/build-deb.sh
      - name: Verify Debian package
        run: |
          dpkg-deb --info dist/linux/*.deb
          dpkg-deb --contents dist/linux/*.deb
          apt-get install -y ./dist/linux/*.deb
          edith-linux --diagnose
      - uses: actions/upload-artifact@v4
        with:
          name: edith-ubuntu-amd64
          path: dist/linux/*.deb
