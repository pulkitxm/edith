name: Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Require main for manual deployment
        if: github.event_name == 'workflow_dispatch'
        run: >-
          test "$GITHUB_REF" = refs/heads/main
          || { echo "deploy blocked: select the main branch" >&2; exit 1; }
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.PUKBOT_CLIENT_ID }}
          private-key: ${{ secrets.PUKBOT_PRIVATE_KEY }}
          owner: pulkitxm
          repositories: edith
          permission-pages: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require site content
        run: |
          test -f apps/site/index.html \
            || { echo "deploy blocked: apps/site/index.html is missing" >&2; exit 1; }
          test -f apps/site/CNAME \
            || { echo "deploy blocked: apps/site/CNAME is missing" >&2; exit 1; }
          grep -qx edith.pulkit.page apps/site/CNAME \
            || { echo "deploy blocked: CNAME does not name edith.pulkit.page" >&2; exit 1; }
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: apps/site
      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
        with:
          token: ${{ steps.app-token.outputs.token }}
