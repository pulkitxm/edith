name: Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Require site content
        run: |
          test -f apps/site/index.html \
            || { echo "deploy blocked: apps/site/index.html is missing" >&2; exit 1; }
          test -f apps/site/CNAME \
            || { echo "deploy blocked: apps/site/CNAME is missing" >&2; exit 1; }
          grep -qx edith.pulkit.page apps/site/CNAME \
            || { echo "deploy blocked: CNAME does not name edith.pulkit.page" >&2; exit 1; }
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/site
      - id: deploy
        uses: actions/deploy-pages@v5
